<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>See The Sea FM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Alex+Brush&display=swap');

  :root{
    --bg-deep:#050B14;
    --bg-panel:#0A121D;
    --bg-panel-2:#0E1A28;
    --teal:#2DEBC8;
    --teal-dim:#1B8F7C;
    --ink:#E8FFFB;
    --slate:#7C93A6;
    --live:#FF5D6C;
    --border:rgba(45,235,200,0.14);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(45,235,200,0.08), transparent 60%),
      var(--bg-deep);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ambient blurred cover-art glow behind everything */
  .cover-ambient{
    position:fixed; inset:-10%;
    z-index:0;
    background-size:cover;
    background-position:center;
    filter:blur(60px) saturate(1.3);
    opacity:0;
    transform:scale(1.15);
    transition:opacity 1.1s ease, background-image 0.6s ease;
    pointer-events:none;
  }
  .cover-ambient.visible{ opacity:0.22; }
  .cover-ambient::after{
    content:'';
    position:absolute; inset:0;
    background:var(--bg-deep);
    opacity:0.72;
  }

  /* ambient wavy background lines */
  .bg-waves{position:fixed; inset:0; z-index:0; opacity:0.5; pointer-events:none;}
  .bg-waves svg{width:100%; height:100%;}
  .bg-line{fill:none; stroke:var(--teal); stroke-opacity:0.06; stroke-width:2;}
  .bg-line.l2{stroke-opacity:0.04; animation:drift 22s linear infinite;}
  .bg-line.l1{animation:drift 30s linear infinite reverse;}
  @keyframes drift{
    0%{transform:translateX(0);}
    100%{transform:translateX(-120px);}
  }

  /* top bar */
  .topbar{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 8px;
  }
  .topbar .title{
    font-family:'Unbounded', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  .topbar button{
    background:none; border:none; color:var(--slate);
    font-size:20px; cursor:pointer; line-height:1;
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .topbar button:hover{ background:rgba(255,255,255,0.05); color:var(--ink); }

  main{
    position:relative; z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 24px 0;
    text-align:center;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--teal-dim);
    text-transform:uppercase;
    margin-top:6px;
  }

  h1.station{
    font-family:'Alex Brush', cursive;
    font-weight:400;
    font-size:56px;
    line-height:1;
    letter-spacing:0.01em;
    margin:8px 0 4px;
    background:linear-gradient(180deg, var(--ink) 0%, var(--teal) 140%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .genres{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    color:var(--slate);
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .genres span{ color:var(--teal); }

  /* ===== Signature element: the eye becomes the visualizer + play control ===== */
  .eye-stage{
    position:relative;
    width:264px;
    height:264px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .eye-stage .eye-tap{ cursor:pointer; transition:transform 0.15s ease; }
  .eye-stage .eye-tap:active{ transform:scale(0.97); }

  .ripple{
    position:absolute;
    left:51.4%; top:45.5%;
    border-radius:50%;
    border:1.5px solid var(--teal);
    opacity:0;
    transform:translate(-50%,-50%);
  }
  body.playing .ripple{ animation:ripple 2.8s ease-out infinite; }
  .ripple.r1{ width:110px; height:110px; animation-delay:0s; }
  .ripple.r2{ width:110px; height:110px; animation-delay:0.9s; }
  .ripple.r3{ width:110px; height:110px; animation-delay:1.8s; }
  @keyframes ripple{
    0%{ width:110px; height:110px; opacity:0.55; }
    100%{ width:260px; height:260px; opacity:0; }
  }

  /* the actual logo artwork, two pre-coloured variants cross-fading */
  .eye-art{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }
  .eye-art-idle{ opacity:1; transition:opacity 0.5s ease; }
  .eye-art-playing{ opacity:0; transition:opacity 0.5s ease, filter 0.5s ease; filter:drop-shadow(0 0 18px rgba(45,235,200,0.45)); }
  body.playing .eye-art-idle{ opacity:0; }
  body.playing .eye-art-playing{ opacity:1; }

  .eye-tap{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:none;
    background:none;
    cursor:pointer;
    border-radius:50%;
  }

  .pupil{
    position:absolute;
    left:51.4%; top:45.5%;
    transform:translate(-50%,-50%);
    width:36px; height:36px;
    border-radius:50%;
    background:var(--bg-deep);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(45,235,200,0.3), 0 0 14px rgba(0,0,0,0.5);
  }
  .pupil::after{
    content:'';
    position:absolute;
    top:6px; left:9px;
    width:6px; height:6px;
    border-radius:50%;
    background:rgba(232,255,251,0.85);
  }
  .pupil svg{ width:15px; height:15px; }
  .pupil .icon-play{ fill:var(--teal); margin-left:2px; }
  .pupil .icon-pause{ fill:var(--teal); }
  body.playing .icon-play{ display:none; }
  body:not(.playing) .icon-pause{ display:none; }

  .status-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-bottom:20px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.12em;
    color:var(--slate);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--slate); }
  body.playing .dot{ background:var(--live); box-shadow:0 0 8px var(--live); animation:pulse-dot 1.6s ease-in-out infinite; }
  @keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .status-text{ text-transform:uppercase; }

  /* volume row */
  .volume-row{
    width:100%; max-width:320px;
    display:flex; align-items:center; gap:12px;
    margin-bottom:26px;
  }
  .volume-row .icon{ color:var(--slate); flex-shrink:0; width:18px; height:18px; }
  .volume-row .icon svg{ width:100%; height:100%; fill:var(--slate); }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:4px; border-radius:4px;
    background:linear-gradient(to right, var(--teal) 0%, var(--teal) 80%, rgba(255,255,255,0.1) 80%, rgba(255,255,255,0.1) 100%);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px rgba(45,235,200,0.6);
    cursor:pointer;
    border:2px solid var(--bg-deep);
  }
  input[type="range"]::-moz-range-thumb{
    width:14px; height:14px; border-radius:50%;
    background:var(--teal); border:2px solid var(--bg-deep);
    box-shadow:0 0 8px rgba(45,235,200,0.6); cursor:pointer;
  }

  /* now playing card */
  .now-playing{
    position:relative; z-index:2;
    width:100%;
    background:var(--bg-panel);
    border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:16px 24px calc(20px + env(safe-area-inset-bottom));
    margin-top:auto;
  }
  .now-playing .label{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    color:var(--slate);
    text-transform:uppercase;
    display:flex; align-items:center; gap:6px;
    margin-bottom:12px;
  }
  .now-playing .label svg{ width:12px; height:12px; fill:var(--teal-dim); }

  .track-row{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
  }

  .cover-thumb{
    position:relative;
    width:56px; height:56px;
    border-radius:12px;
    flex-shrink:0;
    background:var(--bg-panel-2);
    box-shadow:0 0 0 1px var(--border);
    overflow:hidden;
  }
  .cover-thumb img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity 0.5s ease;
  }
  .cover-thumb img.loaded{ opacity:1; }
  .cover-thumb .fallback-icon{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.5s ease;
  }
  .cover-thumb .fallback-icon svg{ width:24px; height:24px; fill:none; stroke:var(--teal-dim); stroke-width:1.6; }
  .cover-thumb.has-image .fallback-icon{ opacity:0; }
  .cover-thumb.loading{ animation:shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer{
    0%,100%{ background:var(--bg-panel-2); }
    50%{ background:#132335; }
  }

  .track-meta{ min-width:0; flex:1; }
  .now-playing .track{
    font-family:'Unbounded', sans-serif;
    font-weight:600;
    font-size:15.5px;
    color:var(--ink);
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .now-playing .artist{
    font-family:'Inter', sans-serif;
    font-size:13px;
    color:var(--slate);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .error-msg{
    display:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--live);
    margin-top:-8px;
    margin-bottom:18px;
  }
</style>
</head>
<body>

  <div class="cover-ambient" id="coverAmbient" aria-hidden="true"></div>

  <div class="bg-waves" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="none">
      <path class="bg-line l1" d="M-50,120 Q 50,90 150,120 T 350,120 T 550,120"/>
      <path class="bg-line l2" d="M-50,220 Q 50,190 150,220 T 350,220 T 550,220"/>
      <path class="bg-line l1" d="M-50,650 Q 50,620 150,650 T 350,650 T 550,650"/>
      <path class="bg-line l2" d="M-50,720 Q 50,690 150,720 T 350,720 T 550,720"/>
    </svg>
  </div>

  <div class="topbar">
    <span class="title">See The Sea FM</span>
    <button id="closeBtn" aria-label="Закрыть">✕</button>
  </div>

  <main>
    <h1 class="station">See The Sea</h1>
    <div class="genres">Techno <span>·</span> Trance <span>·</span> Deep <span>·</span> Chillout</div>

    <div class="eye-stage">
      <div class="ripple r1"></div>
      <div class="ripple r2"></div>
      <div class="ripple r3"></div>

      <img class="eye-art eye-art-idle" id="eyeIdle" src="" alt="" draggable="false">
      <img class="eye-art eye-art-playing" id="eyePlaying" src="" alt="" draggable="false">

      <button class="eye-tap" id="playBtn" aria-label="Слушать / пауза">
        <span class="pupil">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>
    </div>

    <div class="status-row">
      <span class="dot"></span>
      <span class="status-text" id="statusText">Нажми play</span>

    <div class="error-msg" id="errorMsg">Не удалось подключиться к потоку</div>

    <div class="volume-row">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>

      <input type="range" id="volume" min="0" max="100" value="80">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0014 7.97v8.05a4.48 4.48 0 002.5-4.02z"/></svg>
      </span>
    </div>
  </main>

  <div class="now-playing">
    <div class="label">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>
      Сейчас играет
    </div>
    <div class="track-row">
      <div class="cover-thumb" id="coverThumb">
        <span class="fallback-icon">
          <svg viewBox="0 0 24 24"><path d="M2 12c3-5 7-7.5 10-7.5S19 7 22 12c-3 5-7 7.5-10 7.5S5 17 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <img id="coverImg" alt="">
      </div>
      <div class="track-meta">
        <div class="track" id="trackTitle">See The Sea FM</div>
        <div class="artist" id="trackArtist">Никакой рекламы — только музыка 24/7</div>
      </div>
    </div>
  </div>

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#050B14');
    tg.setBackgroundColor && tg.setBackgroundColor('#050B14');
  }

  const audio = new Audio();
  audio.preload = "none";
  audio.crossOrigin = "anonymous";

  const playBtn = document.getElementById('playBtn');
  const statusText = document.getElementById('statusText');
  const errorMsg = document.getElementById('errorMsg');
  const volume = document.getElementById('volume');
  const closeBtn = document.getElementById('closeBtn');

  let isPlaying = false;
  let isLoading = false;

  function setVolumeUI(val){
    const pct = val + '%';
    volume.style.background =
      `linear-gradient(to right, var(--teal) 0%, var(--teal) ${pct}, rgba(255,255,255,0.1) ${pct}, rgba(255,255,255,0.1) 100%)`;
  }
  audio.volume = 0.8;
  setVolumeUI(80);

  volume.addEventListener('input', () => {
    audio.volume = volume.value / 100;
    setVolumeUI(volume.value);
  });

  function updateStatus(){
    if (isLoading){
      statusText.textContent = 'Подключение…';
    } else if (isPlaying){
      statusText.textContent = 'В эфире';
    } else {
      statusText.textContent = 'Нажми play';
    }
  }

  playBtn.addEventListener('click', () => {
    errorMsg.style.display = 'none';
    if (isPlaying){
      audio.pause();
      isPlaying = false;
      document.body.classList.remove('playing');
      updateStatus();
      return;
    }
    if (!audio.src){ audio.src = STREAM_URL; }
    isLoading = true;
    updateStatus();
    audio.play().then(() => {
      isLoading = false;
      isPlaying = true;
      document.body.classList.add('playing');
      updateStatus();
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      fetchNowPlaying();
    }).catch(() => {
      isLoading = false;
      isPlaying = false;
      document.body.classList.remove('playing');
      updateStatus();
      errorMsg.style.display = 'block';
    });
  });

  audio.addEventListener('stalled', () => { errorMsg.style.display = 'block'; });
  audio.addEventListener('error', () => {
    isLoading = false; isPlaying = false;
    document.body.classList.remove('playing');
    updateStatus();
    errorMsg.style.display = 'block';
  });

  closeBtn.addEventListener('click', () => {
    if (tg) tg.close(); else window.close();
  });

  // ── Метаданные трека: исполнитель, название, обложка ────
  const trackTitleEl = document.getElementById('trackTitle');
  const trackArtistEl = document.getElementById('trackArtist');
  const coverThumb = document.getElementById('coverThumb');
  const coverImg = document.getElementById('coverImg');
  const coverAmbient = document.getElementById('coverAmbient');

  let lastTrackKey = '';
  let coverCache = {};

  // Разбирает разные форматы ответа: наш кастомный JSON,
  // либо стандартный Icecast status-json.xsl ({icestats:{source:{title:"Artist - Title"}}})
  function parseNowPlaying(data){
    let title = '', artist = '', cover = '';

    if (data.track || (data.artist && !data.icestats)){
      // формат нашего nowplaying_api.py: {artist, track, artwork}
      title = data.track || data.title || '';
      artist = data.artist || '';
      cover = data.artwork || data.cover || data.image || '';
    } else if (data.icestats){
      const src = Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source;
      const raw = (src && src.title) || '';
      if (raw.includes(' - ')){
        [artist, title] = raw.split(' - ').map(s => s.trim());
      } else {
        title = raw;
      }
    }
    return { title, artist, cover };
  }

  // Публичный iTunes Search API — без ключей, доступен из браузера (CORS открыт).
  // Используется как запасной источник обложки, если она не пришла с основного API.
  async function lookupCoverArt(artist, title){
    const key = (artist + '::' + title).toLowerCase();
    if (coverCache[key] !== undefined) return coverCache[key];
    try{
      const term = encodeURIComponent(`${artist} ${title}`.trim());
      const res = await fetch(`https://itunes.apple.com/search?term=${term}&entity=song&limit=1`);
      const data = await res.json();
      const url = data.results && data.results[0]
        ? data.results[0].artworkUrl100.replace('100x100', '400x400')
        : '';
      coverCache[key] = url;
      return url;
    }catch(e){
      coverCache[key] = '';
      return '';
    }
  }

  function applyCover(url){
    if (!url){
      coverThumb.classList.remove('has-image');
      coverImg.classList.remove('loaded');
      coverAmbient.classList.remove('visible');
      return;
    }
    coverImg.onload = () => {
      coverImg.classList.add('loaded');
      coverThumb.classList.add('has-image');
      coverAmbient.style.backgroundImage = `url(${url})`;
      coverAmbient.classList.add('visible');
    };
    coverImg.src = url;
  }

  async function fetchNowPlaying(){
    if (!NOWPLAYING_API) return;
    try{
      coverThumb.classList.add('loading');
      const res = await fetch(NOWPLAYING_API, { cache: 'no-store' });
      const raw = await res.json();
      const { title, artist, cover } = parseNowPlaying(raw);

      if (title) trackTitleEl.textContent = title;
      if (artist) trackArtistEl.textContent = artist;

      const trackKey = artist + '::' + title;
      if (trackKey !== lastTrackKey){
        lastTrackKey = trackKey;
        coverThumb.classList.remove('has-image');
        coverImg.classList.remove('loaded');

        let artUrl = cover;
        if (!artUrl && (artist || title)){
          artUrl = await lookupCoverArt(artist, title);
        }
        applyCover(artUrl);
      }
      coverThumb.classList.remove('loading');
    }catch(e){
      coverThumb.classList.remove('loading');
      /* тихо игнорируем, оставляем текущий текст */
    }
  }
  fetchNowPlaying();
  setInterval(fetchNowPlaying, 10000);
</script>
</body>
</html>
