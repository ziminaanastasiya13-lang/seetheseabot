<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>See The Sea FM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --teal: #00d9ff;
    --deep: #0a6ebd;
    --cyan: #2dffee;
    --dark: #001220;
    --card: rgba(255,255,255,0.04);
  }

  body {
    background: var(--dark);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,217,255,0.22) 0%, transparent 70%);
    top: -200px; left: -150px;
    animation: pulse1 6s ease-in-out infinite;
  }
  .bg::after {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(10,110,189,0.25) 0%, transparent 70%);
    bottom: -150px; right: -100px;
    animation: pulse2 8s ease-in-out infinite;
  }
  @keyframes pulse1 {
    0%,100% { transform: scale(1) translate(0,0); }
    50% { transform: scale(1.2) translate(30px, 20px); }
  }
  @keyframes pulse2 {
    0%,100% { transform: scale(1) translate(0,0); }
    50% { transform: scale(1.15) translate(-20px, -30px); }
  }

  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,217,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,217,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .logo-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .wave-icon {
    font-size: 64px;
    filter: drop-shadow(0 0 20px rgba(0,217,255,0.8));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .station-name {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--teal), var(--deep), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    line-height: 1.3;
  }

  .genre-tag {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    text-align: center;
  }

  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 50px;
    opacity: 0.3;
    transition: opacity 0.5s;
  }
  .visualizer.active { opacity: 1; }

  .bar {
    width: 5px;
    background: linear-gradient(to top, var(--teal), var(--deep));
    border-radius: 3px 3px 0 0;
    animation: none;
    height: 4px;
    transition: height 0.1s;
  }
  .visualizer.active .bar:nth-child(1) { animation: bar 0.8s ease-in-out infinite; }
  .visualizer.active .bar:nth-child(2) { animation: bar 0.6s ease-in-out infinite 0.1s; }
  .visualizer.active .bar:nth-child(3) { animation: bar 1.0s ease-in-out infinite 0.05s; }
  .visualizer.active .bar:nth-child(4) { animation: bar 0.7s ease-in-out infinite 0.2s; }
  .visualizer.active .bar:nth-child(5) { animation: bar 0.9s ease-in-out infinite 0.15s; }
  .visualizer.active .bar:nth-child(6) { animation: bar 0.65s ease-in-out infinite 0.3s; }
  .visualizer.active .bar:nth-child(7) { animation: bar 1.1s ease-in-out infinite 0.08s; }
  .visualizer.active .bar:nth-child(8) { animation: bar 0.75s ease-in-out infinite 0.25s; }
  .visualizer.active .bar:nth-child(9) { animation: bar 0.85s ease-in-out infinite 0.12s; }
  .visualizer.active .bar:nth-child(10) { animation: bar 0.95s ease-in-out infinite 0.18s; }

  @keyframes bar {
    0%,100% { height: 4px; }
    50% { height: 40px; }
  }

  .player-card {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(0,217,255,0.2);
    border-radius: 20px;
    padding: 24px;
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 0 40px rgba(10,110,189,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .status-dot.live {
    background: var(--teal);
    box-shadow: 0 0 10px var(--teal);
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .play-btn {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid #fff;
    cursor: pointer;
    position: relative;
    background: linear-gradient(135deg, var(--teal), var(--deep));
    box-shadow: 0 0 30px rgba(0,217,255,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(0,217,255,0.7); }
  .play-btn:active { transform: scale(0.95); }

  .play-btn::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid rgba(0,217,255,0.3);
    animation: ring 2s linear infinite;
    opacity: 0;
  }
  .play-btn.playing::before { opacity: 1; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  .play-icon {
    font-size: 32px;
    line-height: 1;
    margin-left: 4px;
    transition: opacity 0.2s;
    color: #fff;
  }

  .volume-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vol-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.7;
    transition: opacity 0.2s, transform 0.1s;
  }
  .vol-btn:active { transform: scale(0.85); opacity: 1; }
  .vol-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .vol-bar-bg {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  .vol-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--deep), var(--teal));
    border-radius: 3px;
    transition: width 0.2s;
  }
  .vol-pct {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    font-family: 'Orbitron', monospace;
  }

  .now-playing {
    width: 100%;
    background: rgba(0,217,255,0.08);
    border: 1px solid rgba(0,217,255,0.2);
    border-radius: 12px;
    padding: 12px 16px;
    text-align: center;
  }
  .np-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .np-artist {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    color: var(--teal);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .np-track {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    gap: 8px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .info-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
  }
  .info-value {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    color: var(--cyan);
  }

  .error-msg {
    display: none;
    font-size: 12px;
    color: #ff6b6b;
    text-align: center;
    padding: 8px;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>

<div class="container">

  <div class="logo-wrap">
    <div class="wave-icon">🌊</div>
    <div class="station-name">See The Sea<br>FM</div>
    <div class="genre-tag">Techno · Trance · Deep · Chillout</div>
  </div>

  <div class="visualizer" id="visualizer">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div>
  </div>

  <div class="player-card">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Нажми Play</span>
    </div>

    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <span class="play-icon" id="playIcon">▶</span>
    </button>

    <div class="volume-wrap">
      <button class="vol-btn" onclick="changeVolume(-10)">🔈</button>
      <div class="vol-bar-wrap">
        <div class="vol-bar-bg">
          <div class="vol-bar-fill" id="volFill" style="width:80%"></div>
        </div>
        <span class="vol-pct" id="volPct">80%</span>
      </div>
      <button class="vol-btn" onclick="changeVolume(10)">🔊</button>
    </div>

    <div class="now-playing" id="nowPlaying" style="display:none">
      <div class="np-label">🎵 Сейчас играет</div>
      <div class="np-artist" id="npArtist">—</div>
      <div class="np-track" id="npTrack">—</div>
    </div>

    <div class="info-row">
      <div class="info-item">
        <div class="info-label">Жанр</div>
        <div class="info-value" style="font-size:10px;color:#00d9ff">TECHNO</div>
      </div>
      <div class="info-item">
        <div class="info-label">Страна</div>
        <div class="info-value" style="font-size:16px">🇺🇿</div>
      </div>
      <div class="info-item">
        <div class="info-label">Формат</div>
        <div class="info-value" style="font-size:10px">128 kbps</div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg">
      ⚠️ Не удалось подключиться к потоку.<br>Проверь интернет-соединение.
    </div>
  </div>

</div>

<audio id="radio" preload="none"></audio>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.setHeaderColor('#001220');
    Telegram.WebApp.setBackgroundColor('#001220');
  }

  const STREAM_URLS = [
    'https://stream.zeno.fm/f3wvbbqmdg8uv',
  ];
  let urlIndex = 0;
  const audio = document.getElementById('radio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const visualizer = document.getElementById('visualizer');
  const errorMsg = document.getElementById('errorMsg');

  let isPlaying = false;
  audio.volume = 0.8;

  function updateMediaSession(artist, track, artworkUrl) {
    if ('mediaSession' in navigator) {
      const img = artworkUrl || 'https://static.wixstatic.com/media/6062a7_fbcc0346d0fe43ac8a6e08d6c6b915aa~mv2_d_1750_1750_s_2.png';
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track || 'Live Stream',
        artist: artist || 'See The Sea FM',
        album: 'Techno · Trance · Deep · Chillout',
        artwork: [{ src: img, sizes: '512x512', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) togglePlay(); });
      navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) togglePlay(); });
    }
  }

  audio.addEventListener('waiting', () => {
    statusText.textContent = 'Загрузка...';
    statusDot.className = 'status-dot';
  });

  audio.addEventListener('playing', () => {
    statusText.textContent = '● LIVE';
    statusDot.className = 'status-dot live';
    visualizer.classList.add('active');
    playBtn.classList.add('playing');
    errorMsg.classList.remove('show');
    urlIndex = 0;
    startMeta();
  });

  audio.addEventListener('pause', () => {
    if (!isPlaying) return;
    statusText.textContent = 'Пауза';
    statusDot.className = 'status-dot';
    visualizer.classList.remove('active');
    playBtn.classList.remove('playing');
  });

  audio.addEventListener('error', () => {
    if (!isPlaying) return;
    urlIndex++;
    if (urlIndex < STREAM_URLS.length) {
      statusText.textContent = 'Пробую другой адрес...';
      setTimeout(() => {
        audio.src = STREAM_URLS[urlIndex];
        audio.play().catch(() => {});
      }, 1000);
    } else {
      statusText.textContent = 'Нет сигнала';
      statusDot.className = 'status-dot';
      visualizer.classList.remove('active');
      playBtn.classList.remove('playing');
      playIcon.textContent = '▶';
      isPlaying = false;
      errorMsg.innerHTML = '⚠️ Радиостанция сейчас не вещает.<br>Попробуй позже.';
      errorMsg.classList.add('show');
    }
  });

  function togglePlay() {
    if (isPlaying) {
      audio.pause();
      audio.src = '';
      playIcon.textContent = '▶';
      isPlaying = false;
      statusText.textContent = 'Остановлено';
      statusDot.className = 'status-dot';
      visualizer.classList.remove('active');
      playBtn.classList.remove('playing');
      stopMeta();
    } else {
      errorMsg.classList.remove('show');
      urlIndex = 0;
      audio.src = STREAM_URLS[urlIndex];
      audio.play().catch(() => {});
      playIcon.textContent = '⏸';
      statusText.textContent = 'Подключение...';
      isPlaying = true;
    }
  }

  let volLevel = 80;
  function changeVolume(delta) {
    volLevel = Math.min(100, Math.max(0, volLevel + delta));
    try { audio.volume = volLevel / 100; } catch(e) {}
    document.getElementById('volFill').style.width = volLevel + '%';
    document.getElementById('volPct').textContent = volLevel + '%';
  }

  const nowPlaying = document.getElementById('nowPlaying');
  const npArtist = document.getElementById('npArtist');
  const npTrack = document.getElementById('npTrack');
  let metaInterval = null;
  let currentArtist = '';
  let currentTrack = '';

  // ⚠️ Вставь сюда свой URL после деплоя API на Fly.io
  const API_URL = 'https://see-the-sea-bot.fly.dev/';

  async function fetchNowPlaying() {
    try {
      const res = await fetch(API_URL, {signal: AbortSignal.timeout(6000)});
      if (res.ok) {
        const data = await res.json();
        if (data.artist && data.artist !== 'See The Sea FM') {
          npArtist.textContent = data.artist;
          npTrack.textContent = data.track || '';
          currentArtist = data.artist;
          currentTrack = data.track || '';
          updateMediaSession(data.artist, data.track, data.artwork);
          return;
        }
      }
    } catch(e) {}
    if (npArtist.textContent === '⏳ Загрузка...') {
      npArtist.textContent = 'See The Sea FM';
      npTrack.textContent = '🌊 Live';
      updateMediaSession('See The Sea FM', 'Live Stream');
    }
  }

  function startMeta() {
    nowPlaying.style.display = 'block';
    npArtist.textContent = '⏳ Загрузка...';
    npTrack.textContent = '';
    updateMediaSession('See The Sea FM', 'Live Stream');
    fetchNowPlaying();
    metaInterval = setInterval(fetchNowPlaying, 20000);
  }

  function stopMeta() {
    nowPlaying.style.display = 'none';
    if (metaInterval) { clearInterval(metaInterval); metaInterval = null; }
  }
</script>

</body>
</html>
